name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Robolectric)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk cervena-tuzka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cervena-tuzka-apk
          path: cervena-tuzka.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cervena-tuzka.apk

      # Stálý odkaz ke stažení do telefonu:
      # https://github.com/<owner>/<repo>/releases/download/nejnovejsi/cervena-tuzka.apk
      - name: Update "nejnovejsi" pre-release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nejnovejsi --yes --cleanup-tag || true
          gh release create nejnovejsi cervena-tuzka.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nejnovější sestavení (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "APK sestavené automaticky z větve ${GITHUB_REF_NAME}. Instalace: stáhnout v telefonu, otevřít, povolit instalaci z neznámých zdrojů."
